<!DOCTYPE html>
<html lang="es">

    <title>Consulta de Actividades</title>
    <link rel="stylesheet" href="css/consultar.css">
</head>
<body>

    <div class="contenedor-consulta">

        <div class="tabla-contenedor">

                        <th>Nombre</th>

                <tbody id="tabla-actividades">

        </div>
